events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
    }

    # Разрешить доступ только с WEB_SERVER_IP
    geo $allowed_ip {
        default 0;
        62.181.43.194 1;  # WEB_SERVER_IP
        127.0.0.1 1;      # Локальный доступ
    }

    server {
        listen 80;

        # Блокируем все запросы не с разрешенных IP
        if ($allowed_ip = 0) {
            return 403;
        }

        location /hls/ {
            vod hls;
            alias /opt/static/videos/;

            # Генерировать относительные URL
            vod_hls_absolute_index_urls off;
            vod_hls_absolute_master_urls off;

            # Кэширование для HLS
            vod_hls_cache on;
            vod_hls_cache_path /tmp/hls_cache;

            # Базовые CORS (для запросов через прокси)
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers '*';

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*';
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
                add_header Access-Control-Allow-Headers '*';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }
}