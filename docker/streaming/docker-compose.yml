version: '3.8'

volumes:
  redis_data:
  mongo_data:

services:
  celery_worker:
    container_name: media_celery_worker
    build:
      context: ../..
      dockerfile: docker/streaming/Dockerfile
    command: >
      sh -c "
      cd /app/planner &&
      celery -A planner worker --loglevel=info --concurrency=4
      "
    volumes:
      - ../../planner/planner:/app/planner:ro
      - ../../planner/tools:/app/tools:ro
      - ../../planner/media:/app/media
      - /mnt:/mnt
    working_dir: /app
    environment:
      - TZ=Europe/Moscow
      - DJANGO_SETTINGS_MODULE=planner.celery_settings
      - PYTHONPATH=/app

      # Database
      - DB_MSSQL_HOST=${DB_MSSQL_HOST}
      - DB_MSSQL_PORT=${DB_MSSQL_PORT}
      - DB_MSSQL_USER=${DB_MSSQL_USER}
      - DB_MSSQL_PASSWORD=${DB_MSSQL_PASSWORD}

      - DB_MONGO_HOST=mongodb
      - DB_MONGO_PORT=${DB_MONGO_PORT}
      - DB_MONGO_USER=${DB_MONGO_USER}
      - DB_MONGO_PASSWORD=${DB_MONGO_PASSWORD}

    env_file:
      - .env
    deploy:
      resources:
        reservations:
          devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]

    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - media-network

  redis:
    container_name: media_redis
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0
    volumes:
      - redis_data:/data
    ports:
      # Доступ только с IP Django сервера
      - "${REDIS_PORT}:6379"
    environment:
      - TZ=Europe/Moscow
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    restart: unless-stopped
    networks:
      - media-network
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  flower:
    image: mher/flower:2.0
    container_name: media_flower
    command: celery flower
    ports:
      - "${FLOWER_PORT}:5555"
    environment:
      - TZ=Europe/Moscow
      - DJANGO_SETTINGS_MODULE=planner.celery_settings
      - PYTHONPATH=/app

      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@redis:${REDIS_PORT}/0
      - FLOWER_BASIC_AUTH=${FLOWER_USER}:${FLOWER_PASSWORD}
      - FLOWER_PORT=${FLOWER_PORT}
      - FLOWER_URL_PREFIX=${FLOWER_PREFIX}
      - FLOWER_PERSISTENT=True
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - redis
      - celery_worker
    networks:
      - media-network

  streaming:
    container_name: media_streaming
    image: voltan/nginx-stream:latest
    hostname: streaming
    ports:
      # Доступ только с IP Django сервера
      - "${STREAMING_SERVER_PORT}:80"
    volumes:
      - /mnt:/opt/static/videos:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - TZ=Europe/Moscow
    restart: unless-stopped
    networks:
      - media-network

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: media_mongodb
    hostname: mongodb
    ports:
      # Доступ только с IP Django сервера
      - "${DB_MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - TZ=Europe/Moscow
      - MONGODB_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGODB_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGODB_INITDB_DATABASE=admin
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

    restart: unless-stopped
    networks:
      - media-network


networks:
  media-network:
    driver: bridge