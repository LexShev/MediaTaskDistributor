version: '3.8'

services:
  wsgi:
    container_name: planner_wsgi
    build:
      context: ../..
      dockerfile: docker/external/Dockerfile
    command: >
      sh -c "
      cd /app/planner &&
      gunicorn planner.wsgi:application 
      --bind 0.0.0.0:8000 
      --workers 10 
      --timeout 240 
      --access-logfile - 
      --error-logfile -
      "
    environment:
      - DJANGO_SETTINGS_MODULE=planner.settings
      - PYTHONPATH=/app
      - BIND=0.0.0.0:8000
    volumes:
      - ../../:/app
    working_dir: /app
    expose:
      - "8000"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - web-network

  asgi:
    container_name: planner_asgi
    build:
      context: ../..
      dockerfile: docker/external/Dockerfile
    command: >
      sh -c "
      cd /app/planner &&
      daphne -b 0.0.0.0 -p 8001 planner.asgi:application
      "
    environment:
      - DJANGO_SETTINGS_MODULE=planner.settings
      - PYTHONPATH=/app
    volumes:
      - ../../:/app
    working_dir: /app
    expose:
      - "8001"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - web-network

  nginx:
    container_name: planner_nginx
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../../planner/static:/app/planner/static:ro    # Статика из корня
      - ../../planner/media:/app/planner/media:ro      # Медиа из корня
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wsgi
      - asgi
    restart: unless-stopped
    networks:
      - web-network

networks:
  web-network:
    driver: bridge
