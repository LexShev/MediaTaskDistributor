<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сервер временно недоступен — tvfab.ru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .error-card {
            max-width: 600px;
            text-align: center;
            padding: 3rem;
        }
        .error-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            opacity: 0.6;
        }
        .btn-retry {
            padding: 0.75rem 2rem;
            font-size: 1.1rem;
        }
        .footer-text {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-icon">&#9881;</div>
            <h1 class="display-5 fw-bold text-secondary mb-3">Сервер временно недоступен</h1>
            <p class="lead text-muted mb-2">
                Ведутся технические работы или возникли проблемы с подключением к серверу компании.
            </p>
            <p class="text-muted mb-4">
                Пожалуйста, попробуйте обновить страницу через несколько минут.
            </p>
            <button onclick="location.reload()" class="btn btn-secondary btn-retry">
                Обновить страницу
            </button>
            <p class="footer-text">
                Если проблема сохраняется длительное время, обратитесь в отдел ИТ обеспечения
            </p>
        </div>
    </div>
</body>
</html>
