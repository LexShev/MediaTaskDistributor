worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Оптимизация производительности
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Таймауты
    keepalive_timeout 65;
    keepalive_requests 100;

    # Лимиты
    client_max_body_size 10M;
    client_body_timeout 12;
    client_header_timeout 12;

    # Буферизация
    output_buffers 32 32k;
    postpone_output 1460;

    # Upstream для WSGI (основной сайт)
    upstream django_wsgi {
        least_conn;  # Балансировка по наименьшему количеству соединений
        server wsgi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # Upstream для ASGI (WebSocket)
    upstream django_asgi {
        least_conn;
        server asgi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTPS сервер (основной)
    server {
        listen 443 ssl;
        http2 on;

        # Лимиты
        client_max_body_size 10M;

        # SSL сертификаты (Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/tvfab.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tvfab.ru/privkey.pem;

        # SSL настройки (современные стандарты)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # SSL оптимизация
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # SSL security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Статика (с кэшированием)
        location /static/ {
            alias /app/planner/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # Медиа файлы (с кэшированием)
        location /media/ {
            alias /app/planner/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # WebSocket запросы - ДОЛЖЕН БЫТЬ ПЕРЕД ОСНОВНЫМ location /
        location /ws/ {
            proxy_pass http://django_asgi;
            proxy_http_version 1.1;

            # WebSocket заголовки
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Таймауты для долгих соединений
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;

            # Отключаем буферизацию
            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }

        # Основные запросы - в WSGI
        location / {
            proxy_pass http://django_wsgi;
            proxy_http_version 1.1;

            # Заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Таймауты
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;

            # Буферизация
            proxy_buffering off;
            proxy_request_buffering off;

            # Keepalive
            proxy_set_header Connection "";
            proxy_buffers 8 16k;
            proxy_buffer_size 32k;
        }

        # Проксирование HLS стримов на медиасервер
        location /hls/ {
            # Проксируем на внутренний медиасервер
            # MEDIA_SERVER_IP
            proxy_pass http://81.24.120.58:8002/hls/;

            # Заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # HLS специфичные настройки
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            # CORS заголовки для HLS
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';

            # Кэширование для HLS сегментов
            proxy_cache_valid 200 1h;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            # OPTIONS запросы
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*';
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
                add_header Access-Control-Allow-Headers '*';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }

    # HTTP редирект на HTTPS
    server {
        listen 80;
        server_name tvfab.ru;

        # Редирект всех остальных запросов
        location / {
            return 301 https://$server_name$request_uri;
        }
    }
}