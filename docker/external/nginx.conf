worker_processes auto;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_user_agent $bad_bot {
        default 0;
        ~*zgrab 1;
        ~*go-http-client 1;
        ~*python-requests 1;
    }

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    keepalive_requests 100;

    client_max_body_size 10M;
    client_body_timeout 12;
    client_header_timeout 12;

    output_buffers 32 32k;
    postpone_output 1460;

    resolver 127.0.0.11 valid=30s ipv6=off;

    upstream django_wsgi {
        least_conn;
        server wsgi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream django_asgi {
        least_conn;
        server asgi:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # tvfab.ru — HTTPS
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;

        server_name tvfab.ru;

        client_max_body_size 10M;

        ssl_certificate /etc/letsencrypt/live/tvfab.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tvfab.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        if ($bad_bot) {
            return 444;
        }

        location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|wp-config) {
            return 444;
        }

        location ~* ^/\.(git|env|svn|htaccess|aws|DS_Store) {
            return 444;
        }

        location ~* ^/(phpinfo\.php|server-status|config\.php|dump\.sql|actuator) {
            return 444;
        }
        location ~* ^/(config/database\.yml|app/config/parameters\.yml) {
            return 444;
        }

        location ~* ^/(___proxy_subdomain_whm|SDK/webLanguage|boaform|developerserver) {
            return 444;
        }

        location ~* \.(php|asp|aspx|jsp|cgi|pl|cfm)$ {
            return 444;
        }

        location ^~ /static/ {
            alias /app/planner/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ^~ /media/ {
            alias /app/planner/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location = /maintenance.html {
            root /etc/nginx;
            internal;
        }

        # ── CinemaAtlas redirects ───────────────────────────────────────────────
        location ~ ^/(film|series)/(\d+)$ {
            return 301 /cinema-atlas/$1/$2;
        }
        location = /login {
            return 301 /cinema-atlas/login;
        }

        location ^~ /cinema-atlas/ {
            set $cinema_atlas_upstream "cinema_atlas_web:5000";
            proxy_pass http://$cinema_atlas_upstream;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /cinema-atlas;
            proxy_set_header Connection "";

            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;

            proxy_buffering off;
            proxy_redirect off;

            proxy_intercept_errors on;
            error_page 502 503 504 = @cinema_atlas_down;
        }

        location @cinema_atlas_down {
            default_type text/html;
            return 503 "<html><body style='text-align:center;padding-top:80px;font-family:sans-serif;background:#111;color:#ccc'><h2>CinemaAtlas</h2><p>Service is not available now</p></body></html>";
        }

        location /ws/ {
            proxy_pass http://django_asgi;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;

            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }

        location / {
            proxy_pass http://django_wsgi;
            proxy_http_version 1.1;

            proxy_intercept_errors on;
            error_page 500 502 503 504 /maintenance.html;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_set_header Connection "";
            proxy_buffers 8 16k;
            proxy_buffer_size 32k;
        }

        location /hls/ {
            proxy_pass http://81.24.120.58:8002/hls/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;

            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
            add_header Access-Control-Allow-Headers '*';
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';

            proxy_cache_valid 200 1h;
            proxy_cache_key "$scheme$request_method$host$request_uri";

            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin '*';
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS';
                add_header Access-Control-Allow-Headers '*';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # HTTP → HTTPS redirects
    # ═══════════════════════════════════════════════════════════════════════════

    # ── tvfab.ru ───────────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name tvfab.ru;

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ── cloud.tvfab.ru ─────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name cloud.tvfab.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # NextCloud — cloud.tvfab.ru (HTTPS)
    # ═══════════════════════════════════════════════════════════════════════════
    server {
        listen 443 ssl;
        http2 on;

        server_name cloud.tvfab.ru;

        client_max_body_size 10G;
        client_body_timeout 600s;

        ssl_certificate /etc/letsencrypt/live/tvfab.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/tvfab.ru/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            set $nextcloud_upstream "nextcloud_app:80";
            proxy_pass http://$nextcloud_upstream;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            proxy_read_timeout 600s;
            proxy_connect_timeout 30s;
            proxy_send_timeout 600s;

            proxy_buffering off;
            proxy_request_buffering off;
        }

        location = /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location = /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }
    }
}