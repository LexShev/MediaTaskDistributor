worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # ограничение на размер загружаемого файла
    client_max_body_size 10M;

    sendfile on;
    keepalive_timeout 65;

    # Upstream для WSGI (основной сайт)
    upstream django_wsgi {
        server prod_wsgi:8000;  # Ваш WSGI сервис
        # Можно добавить несколько для балансировки
        # server prod_wsgi_2:8000;
    }

    # Upstream для ASGI (WebSocket)
    upstream django_asgi {
        server prod_asgi:8001;  # Ваш ASGI сервис
    }

    # HTTPS сервер
    server {
        listen 8000 ssl;
        server_name 192.168.33.3;

        client_max_body_size 10M;

        ssl_certificate /etc/nginx/ssl/planner.crt;
        ssl_certificate_key /etc/nginx/ssl/planner.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Основные запросы - идут в WSGI
        location / {
            proxy_pass http://django_wsgi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Настройки таймаутов
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;

            # Дополнительные настройки для стабильности
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # WebSocket запросы
        location /ws/ {
            proxy_pass http://django_asgi;
            proxy_http_version 1.1;

            # Важно: эти заголовки для WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Таймауты для долгих соединений
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;

            # Отключаем буферизацию
            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }

        # Статика и медиа как раньше
        location /static/ {
            alias /app/planner/static/;
            expires off;
        }

        location /media/ {
            alias /app/planner/media/;
            expires off;
        }
    }

    # Опционально: HTTP редирект на HTTPS
    server {
        listen 80;
        server_name 192.168.33.3;
        return 301 https://$server_name:8000$request_uri;
    }
}