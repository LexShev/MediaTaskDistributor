worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Map для WebSocket
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Ограничение на размер загружаемого файла
    client_max_body_size 10M;

    sendfile on;
    keepalive_timeout 65;

    # Upstream для WSGI (основной сайт)
    upstream django_wsgi {
        server wsgi:8000;
    }

    # Upstream для ASGI (WebSocket)
    upstream django_asgi {
        server asgi:8000;
    }

    # Основной HTTPS сервер (порт 443)
    server {
        listen 443 ssl http2;
        server_name 192.168.33.3 tvfab.local;

        client_max_body_size 10M;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";

        # Security headers
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "upgrade-insecure-requests" always;

        # Статика и медиа
        location /static/ {
            alias /app/planner/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /media/ {
            alias /app/planner/media/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket запросы (должен быть перед location /)
        location /ws/ {
            proxy_pass http://django_asgi;
            proxy_http_version 1.1;

            # WebSocket заголовки
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Стандартные заголовки
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 443;

            # Таймауты для долгих соединений
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 75s;

            # Отключаем буферизацию
            proxy_buffering off;
            proxy_cache off;
            tcp_nodelay on;
        }

        # Основные запросы - идут в WSGI
        location / {
            proxy_pass http://django_wsgi;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Таймауты
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;

            # Буферизация
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Прокси на Streaming сервер
        location /hls/ {
            proxy_pass http://media_streaming:80/hls/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CORS для HLS
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*';

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

    }

    # HTTP редирект на HTTPS (порт 80)
    server {
        listen 80;
        server_name 192.168.33.3 tvfab.local;

        # Редирект на HTTPS с правильным доменом
        return 301 https://tvfab.local$request_uri;
    }
    # Редирект с порта 8000 на основной домен
    server {
        listen 8000 ssl;
        server_name 192.168.33.3 tvfab.local;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Редирект на стандартный HTTPS порт с правильным доменом
        return 301 https://tvfab.local$request_uri;
    }

    # HTTP на порту 8000 тоже редиректим
    server {
        listen 8000;
        server_name 192.168.33.3 tvfab.local;

        # Редирект на стандартный HTTPS порт с правильным доменом
        return 301 https://tvfab.local$request_uri;
    }

}