{% extends 'main/index.html' %}
{% load static %}

{% block body %}

<link rel="stylesheet" type="text/css" href="{% static 'css/schedule_perspective.css' %}?v=13">
<script type="text/javascript" src="{% static 'SortableJS/Sortable.min.js' %}"></script>

<div id="schedule-perspective"
     data-window-url="{% url 'schedule_perspective_window' %}"
     data-search-url="{% url 'schedule_perspective_search' %}"
     data-structure-url="{% url 'schedule_perspective_series_structure' 0 %}"
     data-film-info-url="{% url 'schedule_perspective_film_info' %}"
     data-poster-url="{% url 'schedule_perspective_poster' %}"
     data-slot-add-url="{% url 'schedule_perspective_slot_add' %}"
     data-slot-move-url="{% url 'schedule_perspective_slot_move' %}"
     data-slot-delete-url="{% url 'schedule_perspective_slot_delete' %}"
     data-download-url="{% url 'schedule_perspective_generate_downloads' %}"
     data-export-url="{% url 'schedule_perspective_export' %}"
     data-day-status-url="{% url 'schedule_perspective_day_status' 'approve' %}"
     data-can-edit="{{ can_edit|yesno:'1,0' }}"
     data-default-channel="{{ default_channel }}"
     data-default-start="{{ default_start }}"
     data-default-days="{{ default_days }}">

  <div class="sp-toolbar">
    <select class="form-select form-select-sm sp-channel" id="sp-channel">
      {% for id, name in channels.items %}
        <option value="{{ id }}" {% if id == default_channel %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>

    <div class="btn-group btn-group-sm">
      <button class="btn btn-outline-secondary" id="sp-prev" title="Предыдущий период">‹</button>
      <input type="date" class="form-control form-control-sm sp-date" id="sp-start">
      <button class="btn btn-outline-secondary" id="sp-next" title="Следующий период">›</button>
    </div>

    <select class="form-select form-select-sm sp-days-select" id="sp-days-select">
      {% for d in allowed_days %}
        <option value="{{ d }}" {% if d == default_days %}selected{% endif %}>{{ d }} дней</option>
      {% endfor %}
    </select>

    <div class="sp-search-wrap">
      <div class="input-group input-group-sm">
        <span class="input-group-text">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
          </svg>
        </span>
        <input type="text" class="form-control sp-search-input" id="sp-search-input"
               placeholder="Поиск фильма или сериала…" autocomplete="off"
               {% if not can_edit %}disabled{% endif %}>
      </div>
      <div id="sp-search-panel" class="sp-search-panel d-none">
        <div id="sp-search-step">
          <div class="text-muted small mb-1" id="sp-search-hint"></div>
          <div id="sp-search-results" class="sp-search-results"></div>
        </div>

        <div id="sp-series-step" class="d-none">
          <button class="btn btn-sm btn-outline-secondary mb-2" id="sp-series-back">← Назад</button>
          <div id="sp-series-title" class="fw-bold mb-2"></div>

          <div id="sp-series-oplan" class="d-none">
            <label class="form-label small mb-1">Сезон</label>
            <select class="form-select form-select-sm mb-2" id="sp-season-select"></select>
            <div class="row g-2">
              <div class="col">
                <label class="form-label small mb-1">Серия с</label>
                <input type="number" min="1" value="1" class="form-control form-control-sm" id="sp-ep-from">
              </div>
              <div class="col">
                <label class="form-label small mb-1">по</label>
                <input type="number" min="1" value="1" class="form-control form-control-sm" id="sp-ep-to">
              </div>
            </div>
          </div>

          <div id="sp-series-manual">
            <div class="row g-2">
              <div class="col">
                <label class="form-label small mb-1">Сезон</label>
                <input type="number" min="1" value="1" class="form-control form-control-sm" id="sp-season-num">
              </div>
              <div class="col">
                <label class="form-label small mb-1">Серия с</label>
                <input type="number" min="1" value="1" class="form-control form-control-sm" id="sp-manual-from">
              </div>
              <div class="col">
                <label class="form-label small mb-1">по</label>
                <input type="number" min="1" value="1" class="form-control form-control-sm" id="sp-manual-to">
              </div>
            </div>
            <div class="form-text">Материала нет в Oplan — серии будут созданы как отсутствующие и попадут в список скачивания.</div>
          </div>

          <button class="btn btn-primary btn-sm mt-3" id="sp-series-add">Добавить в сетку</button>
        </div>
      </div>
    </div>

    <div class="sp-target">
      <span class="text-muted">Цель:</span>
      <span id="sp-target-hours">—</span>
    </div>

    <div class="d-flex gap-2">
      <button class="btn btn-sm btn-outline-success" id="sp-approve" {% if not can_edit %}disabled{% endif %}>Утвердить период</button>
      <button class="btn btn-sm btn-outline-warning" id="sp-finalize" {% if not can_edit %}disabled{% endif %}>Финализировать</button>
      <button class="btn btn-sm btn-outline-danger" id="sp-reopen" {% if not can_edit %}disabled{% endif %}>Переоткрыть</button>
      <button class="btn btn-outline-success sp-export-btn" id="sp-export" title="Экспорт в Excel">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
            <path d="M0 0h256v256H0z" fill="none" />
            <g fill="currentColor">
                <path d="M208 88h-56V32Z" opacity=".2" />
                <path d="M156 208a8 8 0 0 1-8 8h-28a8 8 0 0 1-8-8v-56a8 8 0 0 1 16 0v48h20a8 8 0 0 1 8 8m-63.35-62.51a8 8 0 0 0-11.16 1.86L68 166.24l-13.49-18.89a8 8 0 1 0-13 9.3L58.17 180l-16.68 23.35a8 8 0 0 0 13 9.3L68 193.76l13.49 18.89a8 8 0 0 0 13-9.3L77.83 180l16.68-23.35a8 8 0 0 0-1.86-11.16m98.94 25.82c-4-1.16-8.14-2.35-10.45-3.84c-1.25-.82-1.23-1-1.12-1.9a4.54 4.54 0 0 1 2-3.67c4.6-3.12 15.34-1.73 19.82-.56a8 8 0 0 0 4.07-15.48c-2.11-.55-21-5.22-32.83 2.76a20.58 20.58 0 0 0-8.95 14.94c-2 15.89 13.65 20.42 23 23.12c12.06 3.49 13.12 4.92 12.78 7.59c-.31 2.41-1.26 3.33-2.15 3.93c-4.6 3.06-15.16 1.56-19.54.35a8 8 0 0 0-4.29 15.45a60.6 60.6 0 0 0 15.19 2c5.82 0 12.3-1 17.49-4.46a20.81 20.81 0 0 0 9.18-15.23c2.21-17.31-14.31-22.14-24.2-25M40 112V40a16 16 0 0 1 16-16h96a8 8 0 0 1 5.66 2.34l56 56A8 8 0 0 1 216 88v24a8 8 0 1 1-16 0V96h-48a8 8 0 0 1-8-8V40H56v72a8 8 0 0 1-16 0m120-32h28.68L160 51.31Z" />
            </g>
        </svg>
      </button>
    </div>
  </div>

  <div class="sp-viewport">
    <div id="sp-days" class="sp-days"></div>
  </div>
</div>

<!-- Подтверждение действий -->
<div class="modal fade" id="sp-confirm-modal" tabindex="-1">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title">Подтверждение</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="sp-confirm-text"></div>
      <div class="modal-footer py-1">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="button" class="btn btn-sm btn-danger" id="sp-confirm-ok">Подтвердить</button>
      </div>
    </div>
  </div>
</div>

<!-- Popover-тултип (singleton) -->
<div id="sp-popover" class="sp-popover d-none"></div>

<script type="text/javascript" src="{% static 'js/schedule_perspective.js' %}?v=14"></script>

{% endblock %}
