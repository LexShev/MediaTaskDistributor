{% extends 'main/index.html' %}
{% load custom_filters %}
{% load static %}


{% block body %}

<link href="{% static '/css/editors_notifications.css' %}" rel="stylesheet">

<div class="container-flex px-lg-5">
    <br>
  <div class="row mx-0 mb-3 align-items-center">
    {% for field in filter_form %}
      <div class="col ps-0">
        <div class="form-floating">
          {{ field }}
          {{ field.label_tag }}
        </div>
      </div>
    {% endfor %}

  </div>

    <div class="input-group mb-3">
      <label class="input-group-text" for="{{ search_form.search_input.id_for_label }}">{{ search_form.search_input.label }}</label>
        {{ search_form.search_input }}
        <button type="button" class="btn btn-outline-secondary" onclick="loadNotificationList()" id="search_btn" style="width: 7rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
          </svg>
        </button>
    </div>

  <div id="editors_list_container">

  </div>
</div>
<script type="text/javascript" src="{% static 'js/editors_notifications.js' %}"></script>

{% endblock %}
