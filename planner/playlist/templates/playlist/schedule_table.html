<table class="table table-striped table-hover" id="schedule_table">
    <thead class="table-dark">
        <tr>
            <th scope="col">Название</th>
            <th scope="col">Канал</th>
            <th scope="col">Статус</th>
            <th scope="col">Дата изменения</th>
            <th scope="col">Действия</th>
        </tr>
    </thead>
    <tbody id="schedule_table_body">
    {% for schedule in schedules %}
        <tr>
            <td>{{ schedule.day_date }}</td>
            <td>{{ schedule.schedule_id|schedule_name }}</td>
            <td><span class="badge bg-success">Активно</span></td>
            <td>{{ schedule.last_edit_time }}</td>
            <td>
                <button class="btn btn-sm btn-outline-success me-1">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
