{% load custom_filters %}
<table class="table table-striped table-hover" id="schedule_table">
    <thead class="">
        <tr>
            <th scope="col">Название</th>
            <th scope="col">Канал</th>
            <th scope="col">Дата изменения</th>
            <th scope="col">Редактор</th>
            <th scope="col">Статус</th>
        </tr>
    </thead>
    <tbody id="schedule_table_body">
    {% for schedule in schedules %}
        <tr>
            <td>
                <a class="link-body-emphasis link-offset-3-hover link-underline link-underline-opacity-0 link-underline-opacity-75-hover"
                style="cursor: pointer;" data-schedule-day-id="{{ schedule.schedule_day_id }}"
                   data-schedule-id="{{ schedule.schedule_id }}"
                   data-schedule-day-date="{{ schedule.day_date|date:"Y-m-d" }}"
                data-schedule-name="{{ schedule.schedule_id|schedule_name }}"
                   onclick="openSchedDayListById(this)">
                    {{ schedule.day_date|date:"d.m.Y" }}
                </a></td>
            <td class="schedule-id" data-schedule-id="{{ schedule.schedule_id }}">{{ schedule.schedule_id|schedule_name }}</td>
            <td>{{ schedule.last_edit_time|date:"d.m.Y" }}</td>
            <td data-last_edit_user_id="{{ schedule.last_edit_user_id }}">{{ schedule.last_edit_user_id|oplan_worker_name }}</td>
            <td>
                <div class="btn-group btn-group-sm" role="group">
                  <input type="radio" class="btn-check" name="status-radio-{{ schedule.schedule_day_id }}" id="ready-radio-{{ schedule.schedule_day_id }}" autocomplete="off" checked>
                  <label class="btn btn-outline-danger" for="ready-radio-{{ schedule.schedule_day_id }}">не готов</label>
                  <input type="radio" class="btn-check" name="status-radio-{{ schedule.schedule_day_id }}" id="not-ready-radio-{{ schedule.schedule_day_id }}" autocomplete="off">
                  <label class="btn btn-outline-success" for="not-ready-radio-{{ schedule.schedule_day_id }}">готов</label>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
