{% load custom_filters %}

<div class="ms-auto form-check form-switch">
  <input class="form-check-input" type="checkbox" role="switch" id="advert" checked>
  <label class="form-check-label" for="advert">Скрыть оформление и рекламу</label>
</div>

<table class="table table-striped table-hover" id="schedule_table">
    <thead class="table-dark">
        <tr>
            <th scope="col" style="width: 40px;"></th>
            <th scope="col">Время эфира</th>
            <th scope="col">Название</th>
            <th scope="col">Продолжительность</th>
            <th scope="col">Тип</th>
            <th scope="col">Дата изменения</th>
            <th scope="col">Редактор</th>
            <th scope="col">Эфир</th>
        </tr>
    </thead>
    <tbody id="schedule_table_body">
        {% for item in schedule_day_list %}
            {% include "playlist/schedule_day_row.html" with item=item level=0 %}
        {% endfor %}
    </tbody>
</table>
