<!doctype html>
{% load static %}

<html lang="ru" data-bs-theme="auto">
  <head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta name="generator" content="Hugo 0.122.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>TLTV Planner</title>

    <link href="{% static '/img/LOGO_VideoInfo_256x256_WB.ico' %}"  rel="shortcut icon">
    <link href="{% static '/bootstrap-5.3.3-dist/css/bootstrap.min.css' %}"  rel="stylesheet">
    <script type="text/javascript" src="{% static '/bootstrap-5.3.3-dist/js/bootstrap.bundle.min.js' %}"></script>
    <script type="text/javascript" src="{% static '/jquery/jquery-3.7.1.min.js' %}"></script>
    <script type="text/javascript" src="{% static '/js/notifications_websocket.js' %}"></script>

    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4285f4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/static/icons/icon-192x192.png">

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/static/js/serviceworker.js');
      }
    </script>

    <link href="{% static '/css/main.css' %}"  rel="stylesheet">
    <script src="{% static '/bootstrap-5.3.3-dist/js/color-modes.js' %}"></script>
    <link href="{% static '/video-js/video-js.css' %}" rel="stylesheet" />

    <link href="{% static '/css/sidebars.css' %}"  rel="stylesheet">

    <!-- Custom styles for this template -->
</head>

{% if user.is_authenticated %}
    {% if request.user.id == 2 %}
        {% include 'main/header.html' %}
    {% else %}
        {% include 'main/header_upd.html' %}
    {% endif %}

{% endif %}

<body data-user-id="{{ request.user.id|default:'' }}">

{% block body %}
{% endblock %}
</body>

</html>
